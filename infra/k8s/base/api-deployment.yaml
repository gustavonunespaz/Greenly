apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenly-api
  namespace: greenly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: greenly-api
  template:
    metadata:
      labels:
        app: greenly-api
    spec:
      containers:
        - name: api
          image: greenly/api:latest
          ports:
            - containerPort: 3333
          envFrom:
            - configMapRef:
                name: greenly-config
            - secretRef:
                name: greenly-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3333
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
