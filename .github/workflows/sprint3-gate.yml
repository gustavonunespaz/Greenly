name: Sprint 3 Gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  sprint3-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: greenly
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: greenly
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Sprint 3 gate
        env:
          DATABASE_URL: postgresql://postgres:greenly@127.0.0.1:5435/greenly
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: super_secret_dev_key_123
          JWT_REFRESH_SECRET: super_secret_refresh_dev_key_123
          SMOKE_EMAIL: admin@greenly.app
          SMOKE_PASSWORD: greenly123
        run: pnpm gate:sprint3
